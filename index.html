<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<meta name="description" content="Tuto Manga: 664 manga & comics drawing tutorials">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tuto Manga">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<title>Tuto Manga</title>
<style>
:root{--ink:#111;--paper:#fffdf7;--sub:#f1ede2;--muted:#5b5b5b;--acc:#e4002b;--line:#cfc8b6}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
header{background:var(--paper);border-bottom:3px solid var(--ink);padding:10px 12px 8px;background-image:radial-gradient(var(--line) 1px,transparent 1.2px);background-size:8px 8px}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:4px}.brand img{width:52px;height:52px;border-radius:12px;border:2px solid var(--ink);box-shadow:2px 2px 0 var(--ink);flex:0 0 auto}
h1{margin:0;font-size:26px!important;font-size:22px;font-weight:900;letter-spacing:-.5px;font-style:italic}
h1 span{background:var(--ink);color:#fff;padding:0 6px;transform:skew(-8deg);display:inline-block}
.sub{font-size:12px;color:var(--muted);margin-bottom:8px}
.row{display:flex;gap:6px;flex-wrap:wrap}
input,select{font:inherit;font-size:15px;border:2px solid var(--ink);border-radius:6px;padding:8px 10px;background:#fff;color:var(--ink);min-width:0}
input{width:100%;margin-bottom:6px}
select{flex:1 1 30%;padding:6px 6px;font-size:13px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:2px solid var(--ink);border-radius:999px;padding:4px 11px;background:#fff;font-size:13px;font-weight:600;white-space:nowrap}
.chip.on{background:var(--ink);color:#fff;transform:rotate(-1.5deg)}
.chip small{opacity:.6}
.seg{display:flex;border:2px solid var(--ink);border-radius:6px;overflow:hidden;margin-top:6px}
.seg button{flex:1;border:0;background:#fff;font:inherit;font-size:13px;padding:6px 2px;font-weight:600;color:var(--ink)}
.seg button+button{border-left:2px solid var(--ink)}
.seg button.on{background:var(--ink);color:#fff}
.stat{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.stat button{border:1.5px solid var(--ink);background:#fff;border-radius:4px;font-size:12px;padding:3px 8px;color:var(--ink)}
main{padding:6px 12px 40px}
h2{font-size:18px;font-weight:900;margin:22px 0 10px;display:flex;align-items:center;gap:8px}
h2:before{content:"";width:10px;height:18px;background:var(--acc);transform:skew(-12deg);display:inline-block}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:16px}
.card{border:2.5px solid var(--ink);border-radius:6px;background:#fff;box-shadow:4px 4px 0 var(--ink);display:flex;flex-direction:column;overflow:hidden}
.card.done{opacity:.6}
.th{position:relative;display:block;aspect-ratio:16/9;border-bottom:2.5px solid var(--ink);background:var(--sub);overflow:hidden;color:#fff;text-decoration:none}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.tile{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;padding:10px}
.tile b{font-size:24px;font-weight:800}
.tile i{font-style:normal;font-size:12px;opacity:.92}
.tt{background:#010101}.tt b{text-shadow:2px 2px 0 #FE2C55,-2px -2px 0 #25F4EE}
.ig{background:linear-gradient(45deg,#F58529,#DD2A7B 45%,#8134AF 75%,#515BD4)}
.badge{position:absolute;right:6px;top:6px;color:#fff;border:1.5px solid #fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:3px}
.dur{position:absolute;right:6px;bottom:6px;background:#000;color:#fff;font-size:11px;font-family:monospace;padding:1px 5px;border-radius:3px}
.wat{position:absolute;left:6px;top:6px;background:#fff;color:#000;border:2px solid #000;font-size:11px;font-weight:700;padding:1px 6px;border-radius:3px;transform:rotate(-4deg)}
.bd{padding:9px 11px 11px;display:flex;flex-direction:column;gap:5px;flex:1}
.t{color:var(--ink);text-decoration:none;font-weight:650;font-size:14px;line-height:1.3}
.ch{color:var(--muted);font-size:12px}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.tags span{font-size:11px;border:1px solid #999;border-radius:3px;padding:1px 6px;color:#444}
.tags span.lv{background:var(--ink);color:#fff;border-color:var(--ink)}
.tags span.fr{background:#0055A4;color:#fff;border-color:#0055A4}
.tags span.ja{background:#BC002D;color:#fff;border-color:#BC002D}
.tags span.es{background:#C2410C;color:#fff;border-color:#C2410C}
.tags span.latam{background:#0F766E;color:#fff;border-color:#0F766E}
.tags span.spain{background:#1D4ED8;color:#fff;border-color:#1D4ED8}
.views{font-size:11px;color:#5b5b5b;font-variant-numeric:tabular-nums}
.tags span.dub{background:#0B6E4F;color:#fff;border-color:#0B6E4F}
.tags span.cc{background:#1D3557;color:#fff;border-color:#1D3557}
.tip{font-size:12px;color:var(--muted);line-height:1.4;margin-top:6px;padding:8px 10px;border:1.5px dashed var(--line);border-radius:6px;background:#fff}
.acts{display:flex;gap:6px;margin-top:auto;padding-top:6px}
.acts button{border:1.5px solid var(--ink);border-radius:4px;background:#fff;font-size:12px;padding:4px 8px;color:var(--ink);font-family:inherit}
.acts button.on{background:var(--ink);color:#fff}
.more{margin-top:12px;border:2px solid var(--ink);background:#fff;border-radius:6px;padding:7px 14px;font-weight:700;font-size:13px;color:var(--ink)}
.empty,.about{font-size:13px;color:var(--muted);line-height:1.5}
.about{margin-top:30px;border-top:2px dashed var(--line);padding-top:12px}

html{-webkit-text-size-adjust:100%}
body{padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
header{padding-top:calc(10px + env(safe-area-inset-top))}
main{padding-bottom:calc(40px + env(safe-area-inset-bottom))}
input,select{font-size:16px} /* 16px avoids iOS Safari zoom-on-focus */
select{min-height:40px;flex:1 1 42%}
.acts button,.chip,.more,.seg button{min-height:34px}
</style>
</head>

 else if(b.dataset.wat){const id=b.dataset.wat;S.wat.has(id)?S.wat.delete(id):S.wat.add(id);save("watched",[...S.wat]);render()}
 else if(b.dataset.open){S.open.push(b.dataset.open);render()}
 else if(b.id==="reset"){Object.assign(S,{q:"",cat:"all",plat:"all",lang:"all",enacc:"all",lvl:"all",med:"all",sort:"cat",show:"all",open:[]});["q","plat","lang","enacc","lvl","med"].forEach(k=>$(k).value=k==="q"?"":"all");$("sort").value="cat";render()}});
let tm;$("q").addEventListener("input",e=>{clearTimeout(tm);tm=setTimeout(()=>{S.q=e.target.value;render()},150)});
["plat","lang","enacc","lvl","med","sort"].forEach(k=>$(k).addEventListener("change",e=>{S[k]=e.target.value;render()}));
render();
</script>
<script>if("serviceWorker" in navigator){window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js",{scope:"./"}).catch(e=>console.warn("SW",e))})}</script>
